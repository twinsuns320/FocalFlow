name: Build FocalFlow (macOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'focalflow.py'
      - 'license.py'
      - 'focal_paths.py'
      - 'build_mac.sh'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install nuitka ordered-set zstandard \
            PyQt6 opencv-python-headless numpy pillow

      - name: Make build script executable
        run: chmod +x build_mac.sh

      - name: Run Nuitka build
        run: ./build_mac.sh

      - name: Smoke test — app launches without crashing
        run: |
          APP="dist/FocalFlow.app/Contents/MacOS/FocalFlow"
          if [ ! -f "$APP" ]; then
            echo "ERROR: built binary not found at $APP"
            exit 1
          fi
          echo "Binary found, attempting headless launch check..."
          timeout 5 "$APP" --hidden || true
          echo "Launch check complete (non-zero exit from timeout is expected/OK)."

      - name: Upload build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_log.txt
            nuitka_report_focalflow.xml

      - name: Upload FocalFlow.app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FocalFlow-mac-app
          path: dist/FocalFlow.app
          retention-days: 14