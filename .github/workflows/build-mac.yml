name: Build FocalFlow (macOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'focalflow.py'
      - 'license.py'
      - 'focal_paths.py'
      - 'build_mac.sh'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install universal2 Python from python.org pkg
        run: |
          sudo installer -pkg python-3.13.13-macos11.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.13/bin" >> $GITHUB_PATH

      - name: Verify universal2 Python
        run: |
          python3.13 -c "import platform; print(platform.mac_ver())"
          lipo -info /Library/Frameworks/Python.framework/Versions/3.13/Python

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install nuitka ordered-set zstandard \
            pyinstaller PyQt6 opencv-python-headless numpy pillow

      - name: Make build script executable
        run: chmod +x build_mac.sh

      - name: Run build
        run: ./build_mac.sh

      - name: Smoke test — app launches without crashing
        run: |
          APP="dist/FocalFlow.app/Contents/MacOS/FocalFlow"
          if [ ! -f "$APP" ]; then
            echo "ERROR: built binary not found at $APP"
            exit 1
          fi
          echo "Binary found, attempting headless launch check..."
          timeout 5 "$APP" --hidden || true
          echo "Launch check complete (non-zero exit from timeout is expected/OK)."

      - name: Upload build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_log.txt
            nuitka_report_focalflow.xml

      - name: Assemble final distributable package
        if: success()
        run: |
          mkdir -p package
          cp -R dist/FocalFlow.app package/
          cp dist_install/install_FocalFlow package/
          cp install_FocalFlow.command package/
          cp dist_upgrade/upgrade_FocalFlow package/
          cp upgrade_FocalFlow.command package/
          cp splash_FocalFlow.py package/
          cp launch_FocalFlow.py package/
          cp place_result_FocalFlow.py package/
          cp settings_FocalFlow.py package/
          cp uninstall_FocalFlow.command package/
          cp ffmpeg_universal package/ffmpeg
          cp ffprobe_universal package/ffprobe
          cp python-3.13.13-macos11.pkg package/
          cp README.txt package/
          chmod +x package/install_FocalFlow package/install_FocalFlow.command
          chmod +x package/upgrade_FocalFlow package/upgrade_FocalFlow.command
          chmod +x package/ffmpeg package/ffprobe
          cd package
          zip -r -y ../FocalFlow-Mac-Package.zip .

      - name: Upload complete package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FocalFlow-Mac-Package
          path: FocalFlow-Mac-Package.zip
          retention-days: 14